<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ASMS — Change Password</title>
<link rel="stylesheet" href="assets/css/main.css">
</head>
<body style="display:flex;align-items:center;justify-content:center;min-height:100vh">

<div class="panel" style="width:100%;max-width:420px;margin:24px">
  <div class="panel-header">
    <div class="panel-title">🔑 Change your password</div>
  </div>
  <div class="panel-body">
    <div style="font-size:12px;color:var(--text3);margin-bottom:16px">
      You must set a new password before you can continue.
      Use at least 8 characters.
    </div>

    <div class="form-group">
      <label class="form-label" for="currentPassword">Current (temporary) password</label>
      <input class="form-control" type="password" id="currentPassword" autocomplete="current-password">
    </div>
    <div class="form-group">
      <label class="form-label" for="newPassword">New password</label>
      <input class="form-control" type="password" id="newPassword" autocomplete="new-password">
    </div>
    <div class="form-group">
      <label class="form-label" for="confirmPassword">Confirm new password</label>
      <input class="form-control" type="password" id="confirmPassword" autocomplete="new-password">
    </div>

    <div id="errorMsg" style="display:none;color:var(--red);font-size:12px;margin:4px 0 12px"></div>

    <div style="display:flex;gap:10px;justify-content:space-between;margin-top:16px">
      <button class="btn btn-ghost" onclick="logout()">Log out</button>
      <button class="btn btn-primary" id="saveBtn" onclick="changePassword()">Change password</button>
    </div>
  </div>
</div>

<script src="assets/js/config.js"></script>
<script src="assets/js/escape.js"></script>
<script src="assets/js/api.js"></script>
<script>
  requireAuth();

  function showError(msg) {
    const el = document.getElementById('errorMsg');
    el.textContent = msg;
    el.style.display = msg ? 'block' : 'none';
  }

  async function changePassword() {
    const currentPassword = document.getElementById('currentPassword').value;
    const newPassword     = document.getElementById('newPassword').value;
    const confirmPassword = document.getElementById('confirmPassword').value;
    showError('');

    if (!currentPassword || !newPassword) return showError('Fill in all fields.');
    if (newPassword.length < 8)           return showError('The new password must be at least 8 characters.');
    if (newPassword !== confirmPassword)  return showError('The new passwords do not match.');

    const btn = document.getElementById('saveBtn');
    btn.disabled = true; btn.textContent = 'Saving...';
    const res = await api.post('/auth/change-password', { currentPassword, newPassword });
    btn.disabled = false; btn.textContent = 'Change password';

    if (res?.success) {
      // The server signed out other sessions and issued a fresh token for this one
      if (res.data?.accessToken) localStorage.setItem('asms_token', res.data.accessToken);
      showToast('Password changed.', 'success');
      setTimeout(() => { window.location.href = 'dashboard.html'; }, 600);
    } else {
      showError(res?.message || 'Could not change the password.');
    }
  }

  document.addEventListener('keydown', e => { if (e.key === 'Enter') changePassword(); });
</script>
</body>
</html>
